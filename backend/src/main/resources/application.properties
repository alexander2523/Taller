spring.application.name=gestion-taller
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taller_mecanico?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.postal-api-url=${POSTAL_API_URL:https://api.zippopotam.us/MX}
logging.level.root=INFO
