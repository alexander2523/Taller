spring.application.name=gestion-taller
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taller_mecanico?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.postal-api-url=${POSTAL_API_URL:https://api.zippopotam.us/MX}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.password-reset.expose-token=${APP_PASSWORD_RESET_SHOW_TOKEN:false}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.root=INFO
